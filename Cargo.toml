[workspace]
resolver = "3"
members = ["nodes-common"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
homepage = "https://taceo.io/"
repository = "https://github.com/TaceoLabs/nodes-helpers"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alloy = { version = "2", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
axum-test = "20"
backon = { version = "1.6", default-features = false }
eyre = "0.6"
futures = "0.3"
git-version = "0.3"
headers = "0.4"
humantime-serde = "1.1.1"
reqwest = { version = "0.13", default-features = false }
reserve-port = "2"
secrecy = "0.10"
serde = { version = "1", default-features = false }
serde_json = "1"
sqlx = { version = "0.8", default-features = false }
testcontainers-modules = { version = "0.15", default-features = false }
thiserror = "2"
tokio = { version = "1" }
tokio-util = "0.7"
tower = { version = "0.5", default-features = false }
tower-http = "0.6"
tracing = "0.1"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
assertions_on_result_states = "deny"
dbg_macro = "deny"
decimal_literal_representation = "deny"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
missing_assert_message = "deny"
pedantic = { level = "deny", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "deny"

# This profile can be used for CI in pull requests.
[profile.ci-dev]
inherits = "dev"
opt-level = 1
debug = true
incremental = false

[profile.profiling]
inherits = "bench"
debug = true
lto = "thin"
